<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JWT API 테스트</title>
</head>
<body>
<h1>JWT Authentication 테스트 (Thymeleaf)</h1>

<div>
    <p id="authStatus">로그인되지 않음</p>
    <p id="userInfo"></p>
</div>

<hr>

<h2>1. 인증</h2>
<div>
    <label>이메일: <input type="email" id="email" value="user@example.com"></label>
</div>
<div>
    <label>비밀번호: <input type="password" id="password" value="user123"></label>
</div>
<br>
<button onclick="login()">로그인</button>
<button onclick="logout()">로그아웃</button>
<button onclick="refreshToken()">토큰 갱신</button>
<button onclick="getMyInfo()">내 정보</button>

<hr>

<h2>2. 게시판</h2>
<button onclick="getBoards()">전체 조회</button>
<div id="boardList"></div>

<h3>게시글 작성</h3>
<div>
    <label>제목: <input type="text" id="boardTitle"></label>
</div>
<div>
    <label>내용: <textarea id="boardContent"></textarea></label>
</div>
<button onclick="createBoard()">작성</button>

<h3>게시글 수정/삭제</h3>
<div>
    <label>ID: <input type="number" id="targetBoardId"></label>
</div>
<div>
    <label>새 제목: <input type="text" id="updateTitle"></label>
</div>
<div>
    <label>새 내용: <textarea id="updateContent"></textarea></label>
</div>
<button onclick="updateBoard()">수정</button>
<button onclick="deleteBoard()">삭제</button>

<hr>

<h2>3. API 응답</h2>
<pre id="response">응답 표시 영역</pre>

<script th:inline="javascript">
    // 동일 Origin이므로 credentials 기본값 사용 가능

    function showResponse(data, status) {
        document.getElementById('response').textContent =
            `[${new Date().toLocaleTimeString()}] Status: ${status}\n\n${JSON.stringify(data, null, 2)}`;
    }

    function updateAuthStatus(loggedIn, info) {
        document.getElementById('authStatus').textContent =
            loggedIn ? '✓ 로그인됨' : '✗ 로그인되지 않음';
        document.getElementById('userInfo').textContent =
            info ? `${info.email} (${info.role})` : '';
    }

    async function apiCall(url, options = {}) {
        try {
            const res = await fetch(url, {
                ...options,
                credentials: 'same-origin', // fetch -> cookie를 읽어서 같이 전달해줌
                headers: { 'Content-Type': 'application/json', ...options.headers }
            });
            const data = await res.json().catch(() => ({}));
            showResponse(data, res.status);
            return { ok: res.ok, data };
        } catch (e) {
            showResponse({ error: e.message }, 0);
            return { ok: false, data: {} };
        }
    }

    async function login() {
        const result = await apiCall('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });
        if (result.ok) {
            updateAuthStatus(true, { email: document.getElementById('email').value });
            await getMyInfo();
        }
    }

    async function logout() {
        await apiCall('/api/auth/logout', { method: 'POST' });
        updateAuthStatus(false);
    }

    async function refreshToken() {
        await apiCall('/api/auth/refresh', { method: 'POST' });
    }

    async function getMyInfo() {
        const result = await apiCall('/api/me'); // 별도로 인증정보를 전달하는 부분 X
        if (result.ok) updateAuthStatus(true, result.data);
        else updateAuthStatus(false);
    }

    async function getBoards() {
        const result = await apiCall('/api/boards');
        if (result.ok && Array.isArray(result.data)) {
            document.getElementById('boardList').innerHTML = result.data.map(b => `
                    <div>
                        <strong>[${b.id}] ${b.title}</strong>
                        <p>${b.content || ''}</p>
                        <small>작성자: ${b.authorNickname}</small>
                        <hr>
                    </div>
                `).join('');
        }
    }

    async function createBoard() {
        const result = await apiCall('/api/boards', {
            method: 'POST',
            body: JSON.stringify({
                title: document.getElementById('boardTitle').value,
                content: document.getElementById('boardContent').value
            })
        });
        if (result.ok) {
            document.getElementById('boardTitle').value = '';
            document.getElementById('boardContent').value = '';
            await getBoards();
        }
    }

    async function updateBoard() {
        const id = document.getElementById('targetBoardId').value;
        const result = await apiCall(`/api/boards/${id}`, {
            method: 'PUT',
            body: JSON.stringify({
                title: document.getElementById('updateTitle').value,
                content: document.getElementById('updateContent').value
            })
        });
        if (result.ok) await getBoards();
    }

    async function deleteBoard() {
        const id = document.getElementById('targetBoardId').value;
        if (confirm(`게시글 ${id} 삭제?`)) {
            const result = await apiCall(`/api/boards/${id}`, { method: 'DELETE' });
            if (result.ok) await getBoards();
        }
    }

    getBoards();
</script>
</body>
</html>
